[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnesslab-ai"
version = "0.1.0"
description = "Reproducible Model x Harness x Judge evaluation and attribution platform"
readme = "README.md"
requires-python = "==3.12.14"
license = { text = "Proprietary" }
authors = [{ name = "HarnessLab AI" }]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph==1.2.11",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.18,<2",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
harnesslab = "harnesslab.cli:app"
samescale = "harnesslab.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "harnesslab/productization/distribution/AGENTS.md"
"CURRENT_MILESTONE.md" = "harnesslab/productization/distribution/CURRENT_MILESTONE.md"
"PUBLIC_PRODUCT_CONTRACT.md" = "harnesslab/productization/distribution/PUBLIC_PRODUCT_CONTRACT.md"
".agents/skills/samescale-product" = "harnesslab/productization/distribution/.agents/skills/samescale-product"
".dockerignore" = "harnesslab/productization/distribution/.dockerignore"
"alembic" = "harnesslab/productization/distribution/alembic"
"alembic.ini" = "harnesslab/productization/distribution/alembic.ini"
"docker/product" = "harnesslab/productization/distribution/docker/product"
"docker-compose.yml" = "harnesslab/productization/distribution/docker-compose.yml"
"docs" = "harnesslab/productization/distribution/docs"
"frontend/index.html" = "harnesslab/productization/distribution/frontend/index.html"
"frontend/package-lock.json" = "harnesslab/productization/distribution/frontend/package-lock.json"
"frontend/package.json" = "harnesslab/productization/distribution/frontend/package.json"
"frontend/src" = "harnesslab/productization/distribution/frontend/src"
"frontend/tsconfig.json" = "harnesslab/productization/distribution/frontend/tsconfig.json"
"frontend/vite.config.ts" = "harnesslab/productization/distribution/frontend/vite.config.ts"
"judge_suites" = "harnesslab/productization/distribution/judge_suites"
"profiles" = "harnesslab/productization/distribution/profiles"
"pyproject.toml" = "harnesslab/productization/distribution/pyproject.toml"
"README.md" = "harnesslab/productization/distribution/README.md"
"release" = "harnesslab/productization/distribution/release"
"rules.md" = "harnesslab/productization/distribution/rules.md"
"scripts" = "harnesslab/productization/distribution/scripts"
"src" = "harnesslab/productization/distribution/src"
"tasks" = "harnesslab/productization/distribution/tasks"
"uv.lock" = "harnesslab/productization/distribution/uv.lock"

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the configured PostgreSQL development service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
# Historical evidence is read-only input, never maintained execution source.
# Preserve its bytes/digests; tests enforce the dependency and lint boundaries.
extend-exclude = ["docs/evidence/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tasks/core-java-*/**/verifier/verify.py" = ["E501"]
"tasks/core-java-*/**/verifier/subject_probe.py" = ["E501"]
"tasks/repo-*/**/verifier/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "scipy.*"]
ignore_missing_imports = true
