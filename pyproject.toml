[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnesslab-ai"
version = "0.1.0"
description = "Reproducible Model x Harness x Judge evaluation and attribution platform"
readme = "README.md"
requires-python = "==3.12.14"
license = { text = "Proprietary" }
authors = [{ name = "HarnessLab AI" }]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph==1.2.11",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.18,<2",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
harnesslab = "harnesslab.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the configured PostgreSQL development service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tasks/core-java-*/**/verifier/verify.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "scipy.*"]
ignore_missing_imports = true
