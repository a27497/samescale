services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harnesslab}
      POSTGRES_USER: ${POSTGRES_USER:-harnesslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harnesslab_dev_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - harnesslab-postgres:/var/lib/postgresql

volumes:
  harnesslab-postgres:
