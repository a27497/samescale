schema_version: 1
rubric_id: core-score-v2
version: 2.0.0-draft
principles:
  - Judge correctness and safety before style or verbosity.
  - Use the nearest integer anchor; do not invent half-score anchors.
  - Ignore answer length unless it changes substantive quality.
anchors:
  1: "Unusable: materially wrong, unsafe, irrelevant, or unsupported; major correction required."
  2: "Poor: some useful content, but significant correctness, safety, relevance, or completeness defects remain."
  3: "Adequate: mostly correct and usable for the basic task, with notable omissions or imprecision."
  4: "Good: correct, relevant, clear, and substantively complete; only minor improvements remain."
  5: "Excellent: fully correct, relevant, clear, appropriately supported, and robust to important caveats."
caps:
  - "A material factual error or unsafe recommendation normally caps the score at 2."
  - "A required but missing source/reference normally caps the score at 2."
  - "Pure style preference must not move a score by itself."
