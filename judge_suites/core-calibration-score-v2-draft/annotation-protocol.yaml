schema_version: 1
protocol_id: core-score-v2-human-annotation
state: READY_FOR_BLIND_ANNOTATION
annotator_count: 3
rules:
  - Each annotator works independently.
  - Show only rubric, question, candidate, and supplied reference facts.
  - Never show legacy gold, J1 outputs, J3/J3r1 outputs, or qualification thresholds.
  - Score with one integer from 1 through 5 and a short rationale.
  - Do not discuss ratings with other annotators before submission.
adjudication:
  no_large_disagreement: "If max(score)-min(score) <= 1, consensus is the median score."
  large_disagreement: "If max(score)-min(score) >= 2, use a fourth blind adjudicator; retain all original ratings."
  model_outputs_visible_to_adjudicator: false
threshold_policy:
  status: UNSET_PENDING_HUMAN_DISAGREEMENT
  rule: "Freeze SCORE tolerance, MAE threshold, and Spearman threshold only after human annotations are complete and before any new Judge qualification."
  model_outcomes_may_set_thresholds: false
qualification_gate:
  minimum_score_cases: 12
  required_independent_ratings_per_case: 3
  new_judge_calls_before_threshold_freeze: 0
