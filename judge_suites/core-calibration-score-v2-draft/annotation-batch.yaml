schema_version: 1
batch_id: core-score-v2-blind-a
rubric_reference: rubric.yaml
blinding:
  legacy_gold_visible: false
  j1_outputs_visible: false
  j3r1_outputs_visible: false
cases:
  - case_id: score-v2-factual-wrong
    question: "Answer: What is the capital of Germany?"
    candidate: "Paris is the capital of Germany."
  - case_id: score-v2-security-passwords
    question: "How should a web service store user passwords?"
    candidate: "Encrypt passwords with a reversible key so the service can recover them later."
  - case_id: score-v2-deployment-rolling
    question: "Give a safe production deployment approach for a web API."
    candidate: "Use a rolling deployment with health checks and automatic rollback. Monitor error rate during rollout."
  - case_id: score-v2-citation-supported
    question: "State the supplied reference fact and cite the supplied authority."
    reference_facts: "The supplied authority states: Taipei is the capital of Taiwan."
    candidate: "Taipei is Taiwan's capital, according to the supplied authority."
  - case_id: score-v2-partial-http
    question: "Explain what an HTTP 404 status means."
    candidate: "It means the server received the request but the requested resource was not found. It can also happen when a URL is wrong."
  - case_id: score-v2-vague-cache
    question: "Why can a cache improve API performance?"
    candidate: "A cache makes things faster because it stores stuff."
  - case_id: score-v2-sql-injection
    question: "How should an application reduce SQL injection risk?"
    candidate: "Use parameterized queries, validate inputs where appropriate, and avoid concatenating untrusted values into SQL."
  - case_id: score-v2-timeout-incomplete
    question: "What should a backend do when calling an unreliable external API?"
    candidate: "Set a timeout."
  - case_id: score-v2-queue-wrong
    question: "Why might a system use a message queue for background jobs?"
    candidate: "A queue guarantees every job always succeeds and removes the need for retries."
  - case_id: score-v2-transaction-good
    question: "When is a database transaction useful?"
    candidate: "Use a transaction when multiple related database changes must succeed or fail together, such as creating an order and its payment record."
  - case_id: score-v2-required-source-missing
    question: "Using only the supplied source, state its conclusion and cite it."
    reference_facts: "No source was supplied."
    candidate: "The study conclusively proves the claim."
  - case_id: score-v2-error-handling
    question: "Give a practical error-handling rule for a public API."
    candidate: "Return a stable error shape, map expected failures to appropriate status codes, avoid leaking internals, and log enough context for diagnosis."
