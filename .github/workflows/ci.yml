name: HarnessLab Fast CI

on:
  push:
  pull_request:

concurrency:
  group: harnesslab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      frontend: ${{ steps.scope.outputs.frontend }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check routing, complete inventory, and fail-closed summaries
        run: |
          python3 -m unittest -v tests.test_ci_routing
          git diff --check
      - name: Classify cumulative branch changes
        id: scope
        run: python3 scripts/ci_scope.py

  python-checks:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.12.14
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Lint, format, type, and whitespace checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src tests scripts
          git diff --check

  frontend:
    needs: scope
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend contracts
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test
          npm run build

  backend:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' || needs.scope.outputs.frontend == 'true' }}
    name: core (${{ matrix.mode }} ${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: harnesslab
          POSTGRES_USER: harnesslab
          POSTGRES_PASSWORD: harnesslab_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnesslab -d harnesslab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      HARNESSLAB_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://harnesslab:harnesslab_ci_only@127.0.0.1:5432/harnesslab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.12.14
      - name: Install Node 24 for deterministic task verifiers
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Upgrade test database
        run: uv run --locked alembic upgrade head
      - name: Run bounded deterministic core regressions
        run: >-
          uv run --locked python scripts/run_ci_regressions.py
          --mode ${{ matrix.mode }} --index ${{ matrix.index }} --count ${{ matrix.count }}
          --junit "$RUNNER_TEMP/core-${{ matrix.index }}.xml"

  gates:
    # Never publish a lightweight push as the existing full-regression check context.
    name: ${{ needs.scope.outputs.full == 'true' && 'gates' || 'push-feedback' }}
    needs: [scope, python-checks, frontend, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every applicable job to succeed
        env:
          CI_VERIFY_RESULTS: "1"
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_FULL: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || needs.scope.outputs.full == 'true' }}
          CI_FRONTEND: ${{ needs.scope.outputs.frontend }}
        run: python3 scripts/ci_scope.py
