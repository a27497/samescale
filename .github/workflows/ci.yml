name: Gate A

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: harnesslab
          POSTGRES_USER: harnesslab
          POSTGRES_PASSWORD: harnesslab_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnesslab -d harnesslab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      HARNESSLAB_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://harnesslab:harnesslab_ci_only@127.0.0.1:5432/harnesslab
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.12.14
      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run authoritative Gate A verification
        run: uv run --locked python scripts/verify_gate_a.py
      - name: Run authoritative Gate B verification
        run: uv run --locked python scripts/verify_gate_b.py
