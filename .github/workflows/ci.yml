name: Gate A + Gate B + Gate C + Gate D + Gate E + Gate F

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: harnesslab
          POSTGRES_USER: harnesslab
          POSTGRES_PASSWORD: harnesslab_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnesslab -d harnesslab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      HARNESSLAB_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://harnesslab:harnesslab_ci_only@127.0.0.1:5432/harnesslab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.12.14
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run authoritative Gate A verification
        run: uv run --locked python scripts/verify_gate_a.py
      - name: Run authoritative Gate B verification
        run: uv run --locked python scripts/verify_gate_b.py
      - name: Run authoritative Gate C verification
        run: uv run --locked python scripts/verify_gate_c.py
      - name: Run authoritative Gate D verification
        run: uv run --locked python scripts/verify_gate_d.py
      - name: Run authoritative Gate E verification
        run: uv run --locked python scripts/verify_gate_e.py
      - name: Run authoritative Gate F verification
        run: uv run --locked python scripts/verify_gate_f.py
